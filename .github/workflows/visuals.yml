name: visuals-guard
on:
  push:
  pull_request:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow python-docx
      - name: Figures are clean at the edges and the report embeds exactly the rendered figures
        run: python -I -X utf8 report/scripts/verify_visuals.py
